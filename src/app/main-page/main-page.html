<h1>Stefans Test Insta</h1>
<a routerLink="contact">Contact</a>
@for (post of posts; track $index) {
<article>
    <h2>{{ post.name }}</h2>
    <img [src]="post.img" [alt]="post.name + ' Image'">
    <div class="like-row">
        <p>{{ post.likes }} Likes</p>
        @if (post.isLiked) {
        <img class="icons" src="/images/icons/heart-red.png" alt="liked-Icon" (click)="toggleLike(post)">
        } @else {
        <img class="icons" src="/images/icons/heart-black.png" alt="liked-Icon" (click)="toggleLike(post)">
        }
    </div>

</article>
}
